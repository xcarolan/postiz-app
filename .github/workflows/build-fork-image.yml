---
# Builds this fork's image (with the Git Blog provider) and publishes it to
# ghcr.io/xcarolan/postiz-app. Upstream's build-containers.yml pushes to the
# gitroomhq namespace, which a fork cannot write to.
name: "Build Fork Image"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - git-blog-v2.24.0

permissions:
  contents: read
  packages: write

concurrency:
  group: build-fork-image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'xcarolan/postiz-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_VERSION=v2.24.0-git-blog
          tags: |
            ghcr.io/xcarolan/postiz-app:v2.24.0-git-blog
            ghcr.io/xcarolan/postiz-app:v2.24.0-git-blog-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
